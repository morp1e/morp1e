name: ledger

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/scripts/ledger.mjs"
      - ".github/workflows/ledger.yml"

permissions:
  contents: write

concurrency:
  group: ledger
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate ledger
        env:
          GITHUB_TOKEN: ${{ secrets.LEDGER_TOKEN || secrets.GITHUB_TOKEN }}
        run: node .github/scripts/ledger.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/; then
            echo "ledger unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/ledger-dark.svg assets/ledger-light.svg
          git commit -m "chore(ledger): refresh"
          git push
